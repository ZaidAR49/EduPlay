name: Pre-Deployment Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start minimal local Supabase stack
        run: supabase start --exclude studio,gotrue,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor,inbucket

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap ephemeral schema, storage bucket, and test env
        run: node scripts/ci-bootstrap-supabase.mjs

      - name: Build production Next.js bundle
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E regression suite
        id: test
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Send regression report email
        if: always()
        run: npm run test:report:email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TEST_JOB_OUTCOME: ${{ steps.test.outcome }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Tear down ephemeral Supabase containers
        if: always()
        run: supabase stop --no-backup || true
